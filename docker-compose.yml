# KPI Bridge: Docker Compose distribution (reference path when Docker is available).
# Only the application port is published, and only on 127.0.0.1. Ollama and the worker are not exposed.
# CPU by default; optional NVIDIA GPU: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d

name: kpi-bridge

x-app-env: &app-env
  KPI_HOST: 0.0.0.0              # listens inside the container; publication limited to 127.0.0.1 below
  KPI_PORT: "8765"
  KPI_EXTRA_HOSTS: ""
  KPI_OLLAMA_URL: http://ollama:11434
  KPI_OLLAMA_MODEL: ${KPI_OLLAMA_MODEL:-qwen3:4b}
  KPI_MAX_FILE_MIB: ${KPI_MAX_FILE_MIB:-25}
  KPI_MAX_ROWS: ${KPI_MAX_ROWS:-200000}

services:
  app:
    build: .
    image: kpi-bridge:1.0.0
    environment: *app-env
    ports:
      - "127.0.0.1:${KPI_PORT:-8765}:8765"
    volumes:
      - kpi-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [frontend, internal]
    depends_on: [worker]
    restart: unless-stopped

  worker:
    image: kpi-bridge:1.0.0
    build: .
    command: ["python", "-m", "kpibridge.worker"]
    environment:
      <<: *app-env
      KPI_JOB_MEMORY_MIB: "3072"
    volumes:
      - kpi-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    pids_limit: 256
    cpus: 2
    networks: [internal]       # internal network without Internet access: no processing leaves the machine
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.3
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    networks: [internal, models]   # "models" is used for the first model download; no port is published
    restart: unless-stopped

networks:
  frontend: {}
  internal:
    internal: true
  models: {}

volumes:
  kpi-data: {}
  ollama-models: {}
